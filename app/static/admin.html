<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — TravelGroup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin">
    <div id="navbar"></div>

    <div class="max-w-6xl mx-auto py-10 px-4 space-y-10">
        <h1 class="text-2xl font-bold flex items-center gap-2">🛠️ Admin Dashboard</h1>

        <!-- Manage Trips -->
        <div class="tg-surface rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4">Add A Trip</h2>
            <form id="tripForm" class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-2">
                <select id="tMode" class="p-2.5 rounded-lg outline-none">
                    <option value="flight">Flight</option>
                    <option value="bus">Bus</option>
                    <option value="ship">Ship</option>
                </select>
                <input id="tOperator" placeholder="Operator (e.g. Green Africa)" required class="p-2.5 rounded-lg outline-none">
                <input id="tOrigin" placeholder="Origin" required class="p-2.5 rounded-lg outline-none">
                <input id="tDestination" placeholder="Destination" required class="p-2.5 rounded-lg outline-none">
                <input id="tDeparture" type="datetime-local" required class="p-2.5 rounded-lg outline-none">
                <input id="tPrice" type="number" step="0.01" placeholder="Price (NGN)" required class="p-2.5 rounded-lg outline-none">
                <input id="tSeats" type="number" placeholder="Total Seats" required class="p-2.5 rounded-lg outline-none">
                <button type="submit" class="tg-accent font-bold rounded-lg py-2.5 md:col-span-3">Add Trip</button>
            </form>

            <table class="w-full text-left text-sm mt-6">
                <thead>
                    <tr class="tg-text-dim uppercase text-xs">
                        <th class="p-2">Mode</th><th class="p-2">Operator</th><th class="p-2">Route</th>
                        <th class="p-2">Price</th><th class="p-2">Seats</th><th class="p-2"></th>
                    </tr>
                </thead>
                <tbody id="tripsTable"></tbody>
            </table>
        </div>

        <!-- Bookings oversight..... -->
        <div class="tg-surface rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4">All Bookings</h2>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="tg-text-dim uppercase text-xs">
                        <th class="p-2">Ref</th><th class="p-2">Passenger</th><th class="p-2">Route</th>
                        <th class="p-2">Amount</th><th class="p-2">Status</th>
                    </tr>
                </thead>
                <tbody id="bookingsTable"></tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
