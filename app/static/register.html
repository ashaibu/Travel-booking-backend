<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — TravelGroup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="register">
    <div id="navbar"></div>

    <div class="max-w-md mx-auto py-16 px-4">
        <div class="tg-surface rounded-2xl p-8">
            <h2 class="text-2xl font-bold mb-1 text-center">Create Your Account</h2>
            <p class="tg-text-dim text-sm text-center mb-6">Book flights, buses, and ferries in one place</p>

            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="text-sm tg-text-dim">Full Name</label>
                    <input type="text" id="name" required class="mt-1 w-full p-3 rounded-lg outline-none">
                </div>
                <div>
                    <label class="text-sm tg-text-dim">Email</label>
                    <input type="email" id="email" required class="mt-1 w-full p-3 rounded-lg outline-none">
                </div>
                <div>
                    <label class="text-sm tg-text-dim">Phone</label>
                    <input type="tel" id="phone" required class="mt-1 w-full p-3 rounded-lg outline-none">
                </div>
                <div>
                    <label class="text-sm tg-text-dim">Password</label>
                    <input type="password" id="password" required class="mt-1 w-full p-3 rounded-lg outline-none">
                </div>
                <button type="submit" class="w-full tg-accent font-bold py-3 rounded-lg">Register</button>
            </form>

            <p class="text-center tg-text-dim text-sm mt-6">
                Already have an account? <a href="/static/login.html" style="color: var(--accent)" class="underline">Log in</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
