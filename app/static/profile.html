<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — TravelGroup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="profile">
    <div id="navbar"></div>

    <div class="max-w-md mx-auto py-10 px-4">
        <h1 class="text-2xl font-bold mb-6">My Profile</h1>
        <form id="profileForm" class="tg-surface rounded-xl p-6 space-y-4">
            <div>
                <label class="text-sm tg-text-dim">Full Name</label>
                <input type="text" id="profileName" required class="mt-1 w-full p-3 rounded-lg outline-none">
            </div>
            <div>
                <label class="text-sm tg-text-dim">Email</label>
                <input type="email" id="profileEmail" disabled class="mt-1 w-full p-3 rounded-lg outline-none opacity-60">
            </div>
            <div>
                <label class="text-sm tg-text-dim">Phone</label>
                <input type="tel" id="profilePhone" class="mt-1 w-full p-3 rounded-lg outline-none">
            </div>
            <button type="submit" class="w-full tg-accent font-bold py-3 rounded-lg">Save Changes</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
